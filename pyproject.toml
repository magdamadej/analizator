[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-analyzer"
version = "1.0.0"
description = "Aplikacja do analizy danych badawczych"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "termcolor"
]

[project.scripts]
research-analyzer = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "dane",
    "analiza",
    "interfejs",
    "wykresy",
    "baza",
    "logowanie"
]

name: Budowanie i uruchamianie Docker

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Budowanie obrazu
        run: docker build -t research-analyzer .

      - name: Uruchomienie aplikacji
        run: echo "0" | docker run -i --name analyzer-test research-analyzer

      - name: Wyświetlenie logów aplikacji
        if: always()
        run: |
          docker cp analyzer-test:/app/logs/app.log ./app.log
          cat app.log
